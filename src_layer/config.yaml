
use_features:
  - loudness_db
  - spectral_centroid_hz
  - spectral_spread_hz
  - spectral_flatness
  - brightness
  - yin_pitch
  - harmonicity
  - roughness
  - mfcc
  - chroma


analysis_layers:
  enabled: true

  layers: [full, harmonic, percussive, residual]

  features:
    full:
      - loudness_db
      - spectral_centroid_hz
      - spectral_spread_hz
      - spectral_flatness
      - brightness
      - mfcc
      - roughness

    harmonic:
      - loudness_db
      - yin_pitch
      - harmonicity
      - chroma
      - inharmonicity
      - odd_even_ratio
      - spectral_centroid_hz
      - mfcc

    percussive:
      - loudness_db
      - zero_crossing_rate
      - spectral_flux
      - brightness
      - spectral_centroid_hz
      - spectral_flatness
      - mfcc

    residual:
      - loudness_db
      - spectral_flatness
      - brightness
      - roughness
      - zero_crossing_rate

  hpss:
    n_fft: 2048
    hop_size: 512
    window: hann
    harmonic_kernel: 31
    percussive_kernel: 31
    mask_power: 2.0
    margin_harmonic: 1.0
    margin_percussive: 1.0


audio:
  audio_dir: # audio directory here 
  output_csv: # similar
  normalize: true


chunking:
  modes: both

  fixed:
    sizes: [2048]
    hops: [1024]
    keep_tail: false

  dynamic:
    onset_sensitivities: [0.75]
    onset_frame_size: 1024
    onset_hop_size: 256
    onset_n_fft: null
    min_chunk_samples: 2048

  store_chunks: false
  chunk_audio_root: chunked_audio


analysis:
  n_fft: null
  window: hann


synthesis:
  distance:
    metric: weighted_euclidean

  normalization:
    method: robust_range
    q_low: 0.01
    q_high: 0.99
    clamp: true
    eps: 1.0e-12

  target:
    frame_size: 2048
    hop_size: 1024
    mode: adaptive
    energy_gate_db: -70.0
    min_novelty: 0.08
    steady_keep_probability: 0.20
    force_every_samples: 4096
    analysis_jitter_samples: 64

  matching:
    k_multiplier: 1.0
    temperature: 0.15
    recent_memory: 12
    recent_chunk_penalty: 0.20
    recent_file_penalty: 0.05

  density:
    mode: dust
    placement: inside_event
    default: 1.0
    min: 0.1
    max: 4.0

  spray:
    default_samples: 0
    max_samples: 100
    mode: symmetric

  grain_length:
    default_ratio: 1.0
    min_ratio: 0.10
    max_ratio: 2.00

  window:
    type: tukey
    fade_samples: 128
    fade_ratio: 0.25

  render_source:
    mode: full

    layer_mix:
      full: 1.0
      harmonic: 0.0
      percussive: 0.0
      residual: 0.0

  rendering:
    output_gain: 0.95
    normalize_output: true
    grain_time_jitter_samples: 0


feature_defaults:
  loudness_db:
    eps: 1.0e-12

  peak_amplitude: {}
  zero_crossing_rate: {}

  temporal_centroid_s:
    eps: 1.0e-12

  spectral_centroid_hz:
    eps: 1.0e-12

  spectral_spread_hz:
    eps: 1.0e-12

  spectral_rolloff_hz:
    rolloff: 0.85
    eps: 1.0e-12

  spectral_flatness:
    eps: 1.0e-12

  spectral_flux:
    eps: 1.0e-12

  brightness:
    cutoff_hz: 1500.0
    eps: 1.0e-12

  yin_pitch:
    fmin: 50.0
    fmax: 2000.0
    threshold: 0.1
    eps: 1.0e-12

  harmonicity:
    fmin: 50.0
    fmax: 2000.0

  band_energy_ratios:
    bands:
      - [20.0, 250.0]
      - [250.0, 1000.0]
      - [1000.0, 4000.0]
      - [4000.0, .inf]
    eps: 1.0e-12

  mfcc:
    ncoeffs: 8
    nbands: 24
    eps: 1.0e-12

  chroma:
    fmin: 27.5
    eps: 1.0e-12

  inharmonicity:
    n_harmonics: 10
    tolerance: 0.04
    eps: 1.0e-12

  tristimulus:
    n_harmonics: 10
    tolerance: 0.04
    eps: 1.0e-12

  odd_even_ratio:
    n_harmonics: 10
    tolerance: 0.04
    eps: 1.0e-12

  roughness:
    max_peaks: 30
    min_prom: 0.01
    eps: 1.0e-12

  sharpness_acum:
    eps: 1.0e-12